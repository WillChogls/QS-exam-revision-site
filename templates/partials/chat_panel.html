{# Chat tutor panel (UI placeholder). Expects `paper`. Page context lives in data-* for chat.js. #}
<section id="chat" class="chat" aria-labelledby="chat-heading">
  <h2 id="chat-heading">AI tutor</h2>
  <button type="button" id="chat-toggle" class="chat-toggle" aria-controls="chat-panel" aria-expanded="false">Show chat</button>

  <div id="chat-panel" class="chat-panel" hidden
       data-level="{{ paper.level }}"
       data-subject="{{ paper.subject_slug }}"
       data-year="{{ paper.year }}"
       data-paper="{{ paper.paper_number }}"
       data-paper-id="{{ paper.id }}">

    <ol id="chat-messages" class="chat-messages" aria-live="polite" aria-label="Chat messages"></ol>
    <p id="chat-empty" class="chat-empty">No messages yet.</p>

    <form id="chat-form" class="chat-form">
      <p class="form-field chat-question-field">
        <label for="chat-question">Question number (leave blank for the whole paper)</label>
        <input type="number" id="chat-question" name="question" class="chat-question" min="1" step="1">
      </p>
      <p class="form-field chat-input-field">
        <label for="chat-input">Your message</label>
        <input type="text" id="chat-input" name="message" class="chat-input" autocomplete="off" required>
      </p>
      <p class="chat-actions">
        <button type="submit" id="chat-send" class="chat-send">Send</button>
        <button type="button" id="chat-clear" class="chat-clear">Clear chat</button>
      </p>
    </form>
  </div>
</section>
