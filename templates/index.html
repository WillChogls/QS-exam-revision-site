{% extends "base.html" %}
{% block title %}Choose a level{% endblock %}
{% block body_class %}page-index{% endblock %}
{% block content %}
<h1>SQA past papers and coursework</h1>
<section class="level-list-section" aria-labelledby="levels-heading">
  <h2 id="levels-heading">Choose a level</h2>
  <ul class="level-list">
    {% for slug, name in LEVELS.items() %}
    <li class="level-item"><a href="{{ url_for('browse.level', level=slug) }}">{{ name }}</a></li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
